<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instapage Publisher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117; color: #e2e8f0; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a1d27; border-bottom: 1px solid #2d3148;
      padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    header .logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    header .badge {
      font-size: 11px; font-weight: 600; background: #16a34a; color: #fff;
      padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ── Layout ── */
    .main { flex: 1; display: grid; grid-template-columns: 270px 1fr 320px; overflow: hidden; height: calc(100vh - 53px); }

    /* ── Shared ── */
    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: #64748b; margin-bottom: 10px;
    }
    .btn {
      border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #16a34a; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #22c55e; color: #000; }
    .btn-warn { background: #f59e0b; color: #000; }
    .btn-warn:not(:disabled):hover { background: #fbbf24; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:not(:disabled):hover { background: #f87171; }
    .btn-ghost { background: #1a1d27; color: #94a3b8; border: 1px solid #2d3148; }
    .btn-ghost:not(:disabled):hover { background: #2d3148; color: #e2e8f0; }
    .btn-success { background: #22c55e; color: #000; }
    .btn-success:not(:disabled):hover { background: #4ade80; }

    /* ── Left panel ── */
    .left-panel {
      background: #1a1d27; border-right: 1px solid #2d3148;
      padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
    }
    .stat .val { font-size: 24px; font-weight: 700; color: #fff; line-height: 1; }
    .stat .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat.s-done  .val { color: #22c55e; }
    .stat.s-fail  .val { color: #ef4444; }
    .stat.s-rem   .val { color: #f59e0b; }

    .progress-wrap { background: #2d3148; border-radius: 6px; height: 6px; overflow: hidden; }
    .progress-bar  { height: 100%; background: #16a34a; border-radius: 6px; transition: width 0.4s; }

    .current-card {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      padding: 10px 12px; min-height: 52px;
    }
    .current-card .clbl { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .current-card .curl { font-size: 11px; color: #e2e8f0; word-break: break-all; }
    .current-card .idle { color: #4a5568; font-size: 12px; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 11px; color: #94a3b8; }
    .form-group input[type="password"] {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 6px;
      color: #e2e8f0; padding: 8px 10px; font-size: 13px; outline: none; transition: border-color 0.15s;
    }
    .form-group input[type="password"]:focus { border-color: #16a34a; }
    .form-group input::placeholder { color: #4a5568; }

    .controls { display: flex; flex-direction: column; gap: 6px; }
    .controls-row { display: flex; gap: 6px; }
    .controls-row .btn { flex: 1; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-idle    { color: #64748b; background: #1a1d27; border: 1px solid #2d3148; }
    .status-running { color: #16a34a; background: #1a1d27; border: 1px solid #16a34a; animation: pulse 1.5s infinite; }
    .status-paused  { color: #f59e0b; background: #1a1d27; border: 1px solid #f59e0b; }
    .status-done    { color: #22c55e; background: #1a1d27; border: 1px solid #22c55e; }
    .status-error   { color: #ef4444; background: #1a1d27; border: 1px solid #ef4444; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    /* ── Middle panel — page list ── */
    .mid-panel {
      display: flex; flex-direction: column; background: #0f1117;
      border-right: 1px solid #2d3148; overflow: hidden;
    }
    .list-header {
      padding: 14px 16px 10px; border-bottom: 1px solid #2d3148; flex-shrink: 0;
    }
    .list-header-top {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .list-title { font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .list-count { font-size: 11px; color: #64748b; background: #1a1d27; border: 1px solid #2d3148; padding: 2px 7px; border-radius: 10px; }
    .sel-count { font-size: 11px; color: #16a34a; font-weight: 600; margin-left: auto; }

    .search-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .search-input {
      flex: 1; background: #1a1d27; border: 1px solid #2d3148; border-radius: 6px;
      color: #e2e8f0; padding: 7px 10px; font-size: 12px; outline: none; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: #16a34a; }
    .search-input::placeholder { color: #4a5568; }

    .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .qbtn {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: none;
      cursor: pointer; transition: all 0.15s;
    }
    .qbtn-all     { background: #2d3148; color: #e2e8f0; }
    .qbtn-all:hover { background: #3b4262; }
    .qbtn-none    { background: #2d3148; color: #e2e8f0; }
    .qbtn-none:hover { background: #3b4262; }
    .qbtn-failed  { background: #3f1515; color: #ef4444; }
    .qbtn-failed:hover { background: #5c1f1f; }
    .qbtn-pending { background: #2d2a15; color: #f59e0b; }
    .qbtn-pending:hover { background: #403c1a; }

    .page-list { flex: 1; overflow-y: auto; padding: 6px 0; }

    .page-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; cursor: pointer; transition: background 0.1s; user-select: none;
      border-bottom: 1px solid #161922;
    }
    .page-row:hover { background: #1a1d27; }
    .page-row.is-selected { background: #161d14; }
    .page-row.is-processing { background: #0f1a1d; }

    .page-cb { width: 14px; height: 14px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }

    .page-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-pending    { background: #4a5568; }
    .dot-published  { background: #22c55e; }
    .dot-failed     { background: #ef4444; }
    .dot-processing { background: #3b82f6; animation: pulse 1s infinite; }

    .page-info { flex: 1; min-width: 0; }
    .page-title { font-size: 12px; color: #e2e8f0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-url   { font-size: 10px; color: #4a5568; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .page-client { font-size: 10px; color: #64748b; flex-shrink: 0; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

    .page-status { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0; width: 60px; text-align: right; }
    .ps-pending   { color: #4a5568; }
    .ps-published { color: #22c55e; }
    .ps-failed    { color: #ef4444; }
    .ps-processing { color: #3b82f6; }

    .list-empty { padding: 32px; text-align: center; color: #4a5568; font-size: 13px; }
    .list-loading { padding: 32px; text-align: center; color: #64748b; font-size: 13px; }

    /* ── Right panel — log ── */
    .right-panel { display: flex; flex-direction: column; background: #0f1117; overflow: hidden; }
    .log-header {
      padding: 14px 16px; border-bottom: 1px solid #2d3148; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .log-header h2 { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .log-area {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.7;
    }
    .log-line { display: flex; gap: 8px; }
    .log-line .ts  { color: #4a5568; flex-shrink: 0; }
    .log-line .msg { word-break: break-word; }
    .log-line.info    .msg { color: #94a3b8; }
    .log-line.success .msg { color: #22c55e; }
    .log-line.error   .msg { color: #ef4444; }
    .log-line.warn    .msg { color: #f59e0b; }
    .log-empty { color: #4a5568; font-style: italic; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">Instapage Publisher</div>
  <div class="badge">Bulk Restore</div>
  <div style="margin-left:auto;" id="statusBadge"><span class="status-badge status-idle">Idle</span></div>
</header>

<div class="main">

  <!-- ── Left panel ── -->
  <div class="left-panel">

    <div>
      <div class="section-title">Overall Progress</div>
      <div class="stats">
        <div class="stat"><div class="val" id="statTotal">—</div><div class="lbl">Total</div></div>
        <div class="stat s-done"><div class="val" id="statCompleted">0</div><div class="lbl">Published</div></div>
        <div class="stat s-fail"><div class="val" id="statFailed">0</div><div class="lbl">Failed</div></div>
        <div class="stat s-rem"><div class="val" id="statRemaining">—</div><div class="lbl">Remaining</div></div>
      </div>
      <div style="margin-top:10px;">
        <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
        <div style="font-size:10px;color:#64748b;margin-top:4px;text-align:right;" id="progressPct">0%</div>
      </div>
    </div>

    <div>
      <div class="section-title">Currently Processing</div>
      <div class="current-card" id="currentCard"><div class="idle">Not running</div></div>
    </div>

    <div class="form-group">
      <div class="section-title">Instapage API Token</div>
      <input type="password" id="apiToken" placeholder="Paste Personal API Token" />
    </div>

    <div class="form-group">
      <label>Delay between pages — <span id="delayLabel" style="color:#e2e8f0;font-weight:600;">12s</span></label>
      <input type="range" id="delaySeconds" min="5" max="30" value="12"
        oninput="document.getElementById('delayLabel').textContent=this.value+'s'"
        style="width:100%;accent-color:#16a34a;margin-top:4px;" />
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#4a5568;margin-top:2px;">
        <span>5s</span><span>30s</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btnStart" onclick="startJob()">▶ Publish Selected</button>
      <div class="controls-row">
        <button class="btn btn-warn"   id="btnPause" disabled onclick="pauseJob()">⏸ Pause</button>
        <button class="btn btn-danger" id="btnStop"  disabled onclick="stopJob()">■ Stop</button>
      </div>
      <button class="btn btn-ghost" id="btnClear" onclick="clearProgress()" style="font-size:11px;margin-top:4px;">Reset Progress</button>
      <button class="btn btn-ghost" onclick="clearIndex()" style="font-size:11px;">Rebuild Page Index</button>
    </div>

  </div>

  <!-- ── Middle panel — page list ── -->
  <div class="mid-panel">
    <div class="list-header">
      <div class="list-header-top">
        <div class="list-title">Landing Pages</div>
        <div class="list-count" id="listCount">—</div>
        <div class="sel-count" id="selCount"></div>
      </div>
      <div class="search-row">
        <input class="search-input" id="searchInput" placeholder="Search pages or clients…" oninput="filterList()" />
      </div>
      <div class="quick-btns">
        <button class="qbtn qbtn-all"     onclick="selectVisible('all')">Select All</button>
        <button class="qbtn qbtn-none"    onclick="selectVisible('none')">Deselect All</button>
        <button class="qbtn qbtn-failed"  onclick="selectVisible('failed')">Select Failed</button>
        <button class="qbtn qbtn-pending" onclick="selectVisible('pending')">Select Pending</button>
      </div>
    </div>
    <div class="page-list" id="pageList">
      <div class="list-loading">Loading pages…</div>
    </div>
  </div>

  <!-- ── Right panel — log ── -->
  <div class="right-panel">
    <div class="log-header">
      <h2>Activity Log</h2>
      <button class="btn btn-ghost" onclick="clearLog()" style="padding:4px 10px;font-size:11px;">Clear</button>
    </div>
    <div class="log-area" id="logArea"><div class="log-empty">Waiting to start…</div></div>
  </div>

</div>

<script>
  // ── Data ──────────────────────────────────────────────────────────────────────
  let allPages   = [];  // full page objects from /api/pages
  let logEmpty   = true;

  // ── SSE ───────────────────────────────────────────────────────────────────────
  const es = new EventSource('/events');
  es.onmessage = e => {
    const { type, payload } = JSON.parse(e.data);
    if (type === 'log')         appendLog(payload.msg, payload.level);
    if (type === 'state')       updateState(payload);
    if (type === 'page_status') applyPageStatus(payload.url, payload.status);
  };

  // ── Load pages list ───────────────────────────────────────────────────────────
  async function loadPages() {
    try {
      const data = await fetch('/api/pages').then(r => r.json());
      allPages = data;
      renderList(allPages);
      document.getElementById('listCount').textContent = `${allPages.length} pages`;
      updateSelCount();
    } catch (err) {
      document.getElementById('pageList').innerHTML = `<div class="list-empty">Failed to load pages: ${escHtml(err.message)}</div>`;
    }
  }
  loadPages();

  // ── Render list ───────────────────────────────────────────────────────────────
  function renderList(pages) {
    const list = document.getElementById('pageList');
    if (!pages.length) { list.innerHTML = '<div class="list-empty">No pages match.</div>'; return; }

    list.innerHTML = pages.map(p => `
      <div class="page-row${p._selected ? ' is-selected' : ''}" data-url="${escAttr(p.url)}" data-status="${p.status}" onclick="toggleRow(this)">
        <input type="checkbox" class="page-cb" ${p._selected ? 'checked' : ''} onclick="event.stopPropagation();toggleRow(this.closest('.page-row'))" />
        <div class="page-dot dot-${p.status}"></div>
        <div class="page-info">
          <div class="page-title">${escHtml(p.title || p.url)}</div>
          <div class="page-url">${escHtml(p.url)}</div>
        </div>
        <div class="page-client">${escHtml(p.clientName)}</div>
        <div class="page-status ps-${p.status}">${statusLabel(p.status)}</div>
      </div>
    `).join('');
  }

  function statusLabel(s) {
    return { pending: 'Pending', published: 'Published', failed: 'Failed', processing: 'Running' }[s] || s;
  }

  // ── Toggle row ────────────────────────────────────────────────────────────────
  function toggleRow(row) {
    const url = row.dataset.url;
    const page = allPages.find(p => p.url === url);
    if (!page) return;
    page._selected = !page._selected;
    row.classList.toggle('is-selected', page._selected);
    row.querySelector('.page-cb').checked = page._selected;
    updateSelCount();
    updateStartBtn();
  }

  // ── Quick-select ──────────────────────────────────────────────────────────────
  function selectVisible(mode) {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const visible = allPages.filter(p => matchesSearch(p, query));

    visible.forEach(p => {
      if (mode === 'all')     p._selected = true;
      if (mode === 'none')    p._selected = false;
      if (mode === 'failed')  p._selected = (p.status === 'failed');
      if (mode === 'pending') p._selected = (p.status === 'pending');
    });

    filterList();
    updateSelCount();
    updateStartBtn();
  }

  // ── Search filter ─────────────────────────────────────────────────────────────
  function matchesSearch(p, q) {
    if (!q) return true;
    return p.url.toLowerCase().includes(q) ||
           (p.title || '').toLowerCase().includes(q) ||
           (p.clientName || '').toLowerCase().includes(q);
  }

  function filterList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderList(allPages.filter(p => matchesSearch(p, q)));
  }

  // ── Selection count ───────────────────────────────────────────────────────────
  function updateSelCount() {
    const n = allPages.filter(p => p._selected).length;
    const el = document.getElementById('selCount');
    el.textContent = n ? `${n} selected` : '';
  }

  function updateStartBtn() {
    const n   = allPages.filter(p => p._selected).length;
    const btn = document.getElementById('btnStart');
    if (!btn.disabled) btn.textContent = n ? `▶ Publish ${n} Selected` : '▶ Publish All Remaining';
  }
  updateStartBtn();

  // ── Real-time page status ─────────────────────────────────────────────────────
  function applyPageStatus(url, status) {
    const page = allPages.find(p => p.url === url);
    if (page) page.status = status;
    const row = document.querySelector(`.page-row[data-url="${CSS.escape(url)}"]`);
    if (!row) return;
    row.dataset.status = status;
    row.classList.toggle('is-processing', status === 'processing');
    row.querySelector('.page-dot').className = `page-dot dot-${status}`;
    const psEl = row.querySelector('.page-status');
    psEl.className = `page-status ps-${status}`;
    psEl.textContent = statusLabel(status);
  }

  // ── State update ──────────────────────────────────────────────────────────────
  function updateState(s) {
    document.getElementById('statTotal').textContent     = s.total     || '—';
    document.getElementById('statCompleted').textContent = s.completed ?? 0;
    document.getElementById('statFailed').textContent    = s.failed    ?? 0;
    document.getElementById('statRemaining').textContent = s.remaining ?? '—';
    updateProgressBar(s.completed, s.total);
    updateStatusBadge(s.status);
    updateButtons(s.status);
    updateCurrentCard(s.current);
  }

  function updateProgressBar(done, total) {
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
  }

  function updateStatusBadge(status) {
    const map = { idle:'status-idle', running:'status-running', paused:'status-paused', done:'status-done', error:'status-error' };
    const lbl = { idle:'Idle', running:'Running', paused:'Paused', done:'Done', error:'Error' };
    document.getElementById('statusBadge').innerHTML =
      `<span class="status-badge ${map[status] || 'status-idle'}">${lbl[status] || 'Idle'}</span>`;
  }

  function updateButtons(status) {
    const start = document.getElementById('btnStart');
    const pause = document.getElementById('btnPause');
    const stop  = document.getElementById('btnStop');
    const clear = document.getElementById('btnClear');
    const running = status === 'running', paused = status === 'paused', active = running || paused;

    start.disabled = active;
    pause.disabled = !running;
    stop.disabled  = !active;
    clear.disabled = active;

    if (!active) updateStartBtn();
    else start.textContent = running ? '▶ Running…' : '▶ Paused';

    if (paused) {
      pause.textContent = '▶ Resume'; pause.className = 'btn btn-success'; pause.onclick = resumeJob;
    } else {
      pause.textContent = '⏸ Pause';  pause.className = 'btn btn-warn';    pause.onclick = pauseJob;
    }
  }

  function updateCurrentCard(current) {
    const card = document.getElementById('currentCard');
    card.innerHTML = current
      ? `<div class="clbl">Page ${current.index} of ${current.total}</div><div class="curl">${escHtml(current.url)}</div>`
      : `<div class="idle">Not running</div>`;
  }

  // ── Log ───────────────────────────────────────────────────────────────────────
  function appendLog(msg, level = 'info') {
    const area = document.getElementById('logArea');
    if (logEmpty) { area.innerHTML = ''; logEmpty = false; }
    const ts  = new Date().toLocaleTimeString('en-US', { hour12: false });
    const div = document.createElement('div');
    div.className = `log-line ${level}`;
    div.innerHTML = `<span class="ts">${ts}</span><span class="msg">${escHtml(msg)}</span>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }
  function clearLog() {
    document.getElementById('logArea').innerHTML = '<div class="log-empty">Log cleared.</div>';
    logEmpty = false;
  }

  // ── Controls ──────────────────────────────────────────────────────────────────
  function startJob() {
    const token = document.getElementById('apiToken').value.trim();
    if (!token) { alert('Please enter your Instapage API token.'); return; }

    const selected = allPages.filter(p => p._selected).map(p => p.url);
    const delaySeconds = parseInt(document.getElementById('delaySeconds').value, 10);

    fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, delaySeconds, selectedUrls: selected.length ? selected : undefined }),
    }).catch(err => appendLog('Failed to start: ' + err.message, 'error'));
  }

  function pauseJob()  { fetch('/api/pause',  { method: 'POST' }); }
  function resumeJob() { fetch('/api/resume', { method: 'POST' }); }
  function stopJob()   { if (!confirm('Stop the current job?')) return; fetch('/api/stop', { method: 'POST' }); }

  function clearIndex() {
    if (!confirm('Delete the cached page index? It will rebuild on the next run.')) return;
    fetch('/api/clear-index', { method: 'POST' }).then(() => appendLog('Index cleared.', 'warn'));
  }

  function clearProgress() {
    if (!confirm('Reset all publish progress? This cannot be undone.')) return;
    fetch('/api/clear-progress', { method: 'POST' }).then(r => r.json()).then(() => {
      appendLog('Progress reset.', 'warn');
      allPages.forEach(p => { p.status = 'pending'; p._selected = false; });
      filterList();
      updateSelCount();
      fetch('/api/status').then(r => r.json()).then(d => {
        document.getElementById('statTotal').textContent     = d.total ?? '—';
        document.getElementById('statCompleted').textContent = 0;
        document.getElementById('statFailed').textContent    = 0;
        document.getElementById('statRemaining').textContent = d.remaining ?? '—';
        updateProgressBar(0, d.total);
      });
    });
  }

  // ── Load initial status ───────────────────────────────────────────────────────
  fetch('/api/status').then(r => r.json()).then(d => {
    document.getElementById('statTotal').textContent     = d.total ?? '—';
    document.getElementById('statCompleted').textContent = d.completed ?? 0;
    document.getElementById('statFailed').textContent    = d.failed ?? 0;
    document.getElementById('statRemaining').textContent = d.remaining ?? '—';
    updateProgressBar(d.completed, d.total);
  });

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }
</script>
</body>
</html>
