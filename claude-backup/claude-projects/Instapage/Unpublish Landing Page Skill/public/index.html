<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instapage Unpublisher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    header .badge {
      font-size: 11px; font-weight: 600; background: #3b4fd8; color: #fff;
      padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .main { flex: 1; display: grid; grid-template-columns: 380px 1fr; gap: 0; }

    /* ── Left panel ── */
    .left-panel {
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: #64748b; margin-bottom: 12px;
    }

    /* Stats */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 10px;
      padding: 14px; display: flex; flex-direction: column; gap: 4px;
    }
    .stat .value { font-size: 28px; font-weight: 700; color: #fff; line-height: 1; }
    .stat .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat.completed .value { color: #22c55e; }
    .stat.failed .value { color: #ef4444; }
    .stat.remaining .value { color: #f59e0b; }

    /* Progress bar */
    .progress-wrap { background: #2d3148; border-radius: 8px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: #3b4fd8; border-radius: 8px; transition: width 0.4s ease; }

    /* Current */
    .current-card {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 10px;
      padding: 14px; min-height: 70px;
    }
    .current-card .current-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .current-card .current-title { font-size: 13px; color: #e2e8f0; font-weight: 500; line-height: 1.4; word-break: break-word; }
    .current-card .current-url { font-size: 11px; color: #64748b; margin-top: 4px; word-break: break-all; }
    .current-card .idle-msg { color: #4a5568; font-size: 13px; }

    /* Credentials */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: #94a3b8; }
    .form-group input {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      color: #e2e8f0; padding: 10px 12px; font-size: 14px; outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #3b4fd8; }
    .form-group input::placeholder { color: #4a5568; }

    /* Toggle */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 10px 14px;
    }
    .toggle-row span { font-size: 13px; color: #94a3b8; }
    .toggle {
      position: relative; width: 40px; height: 22px; background: #2d3148;
      border-radius: 11px; cursor: pointer; transition: background 0.2s;
    }
    .toggle.on { background: #3b4fd8; }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }

    /* Buttons */
    .btn {
      border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex;
      align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #3b4fd8; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #4a5fe8; }
    .btn-warn { background: #f59e0b; color: #000; }
    .btn-warn:not(:disabled):hover { background: #fbbf24; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:not(:disabled):hover { background: #f87171; }
    .btn-ghost { background: #1a1d27; color: #94a3b8; border: 1px solid #2d3148; }
    .btn-ghost:not(:disabled):hover { background: #2d3148; color: #e2e8f0; }
    .btn-success { background: #22c55e; color: #000; }
    .btn-success:not(:disabled):hover { background: #4ade80; }

    .controls { display: flex; flex-direction: column; gap: 8px; }
    .controls-row { display: flex; gap: 8px; }
    .controls-row .btn { flex: 1; }

    /* Status badge */
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .status-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status-idle { color: #64748b; background: #1a1d27; border: 1px solid #2d3148; }
    .status-running { color: #3b4fd8; background: #1a1d27; border: 1px solid #3b4fd8; animation: pulse 1.5s infinite; }
    .status-paused { color: #f59e0b; background: #1a1d27; border: 1px solid #f59e0b; }
    .status-done { color: #22c55e; background: #1a1d27; border: 1px solid #22c55e; }
    .status-error { color: #ef4444; background: #1a1d27; border: 1px solid #ef4444; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* ── Right panel (log) ── */
    .right-panel {
      display: flex; flex-direction: column;
      background: #0f1117;
    }
    .log-header {
      padding: 16px 24px; border-bottom: 1px solid #2d3148;
      display: flex; align-items: center; justify-content: space-between;
    }
    .log-header h2 { font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .log-area {
      flex: 1; overflow-y: auto; padding: 16px 24px;
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
      font-size: 12px; line-height: 1.7;
    }
    .log-line { display: flex; gap: 10px; }
    .log-line .ts { color: #4a5568; flex-shrink: 0; }
    .log-line .msg { word-break: break-word; }
    .log-line.info .msg { color: #94a3b8; }
    .log-line.success .msg { color: #22c55e; }
    .log-line.error .msg { color: #ef4444; }
    .log-line.warn .msg { color: #f59e0b; }
    .log-empty { color: #4a5568; font-style: italic; padding: 8px 0; }

    /* Failed panel */
    .failed-section { display: none; padding: 16px 24px; border-top: 1px solid #2d3148; max-height: 220px; overflow-y: auto; }
    .failed-section.visible { display: block; }
    .failed-section h3 { font-size: 12px; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .failed-item { font-size: 12px; color: #94a3b8; padding: 5px 0; border-bottom: 1px solid #1a1d27; word-break: break-all; }
    .failed-item .failed-url { color: #ef4444; }
    .failed-item .failed-reason { color: #64748b; font-size: 11px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">Instapage Unpublisher</div>
  <div class="badge">Bulk Tool</div>
  <div style="margin-left: auto;" id="statusBadge">
    <span class="status-badge status-idle">Idle</span>
  </div>
</header>

<div class="main">
  <!-- Left panel -->
  <div class="left-panel">

    <!-- Stats -->
    <div>
      <div class="section-title">Progress</div>
      <div class="stats">
        <div class="stat">
          <div class="value" id="statTotal">—</div>
          <div class="label">Total</div>
        </div>
        <div class="stat completed">
          <div class="value" id="statCompleted">0</div>
          <div class="label">Done</div>
        </div>
        <div class="stat failed">
          <div class="value" id="statFailed">0</div>
          <div class="label">Failed</div>
        </div>
        <div class="stat remaining">
          <div class="value" id="statRemaining">—</div>
          <div class="label">Remaining</div>
        </div>
      </div>
      <div style="margin-top: 12px;">
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div style="font-size: 11px; color: #64748b; margin-top: 6px; text-align: right;" id="progressPct">0%</div>
      </div>
    </div>

    <!-- Current page -->
    <div>
      <div class="section-title">Currently Processing</div>
      <div class="current-card" id="currentCard">
        <div class="idle-msg">Not running</div>
      </div>
    </div>

    <!-- Credentials -->
    <div>
      <div class="section-title">Instapage API Token</div>
      <div class="form-group">
        <input type="password" id="apiToken" placeholder="Paste your Personal API Token" />
      </div>
    </div>

    <!-- Batch settings -->
    <div>
      <div class="section-title">Batch Settings</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="form-group">
          <label>Pages per run <span id="batchLabel" style="color:#e2e8f0; font-weight:600;">10</span></label>
          <input type="range" id="batchSize" min="1" max="128" value="10"
            oninput="document.getElementById('batchLabel').textContent = this.value === '128' ? 'All' : this.value"
            style="width:100%; accent-color:#3b4fd8; margin-top:6px;" />
          <div style="display:flex; justify-content:space-between; font-size:11px; color:#4a5568; margin-top:2px;">
            <span>1</span><span>All 128</span>
          </div>
        </div>
        <div class="form-group">
          <label>Delay between pages <span id="delayLabel" style="color:#e2e8f0; font-weight:600;">12s</span></label>
          <input type="range" id="delaySeconds" min="5" max="30" value="12"
            oninput="document.getElementById('delayLabel').textContent = this.value + 's'"
            style="width:100%; accent-color:#3b4fd8; margin-top:6px;" />
          <div style="display:flex; justify-content:space-between; font-size:11px; color:#4a5568; margin-top:2px;">
            <span>5s</span><span>30s</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="btnStart" onclick="startJob()">
        ▶ Start
      </button>
      <div class="controls-row">
        <button class="btn btn-warn" id="btnPause" disabled onclick="pauseJob()">
          ⏸ Pause
        </button>
        <button class="btn btn-danger" id="btnStop" disabled onclick="stopJob()">
          ■ Stop
        </button>
      </div>
      <button class="btn btn-ghost" id="btnClear" onclick="clearProgress()" style="margin-top: 4px; font-size: 12px;">
        Reset Progress
      </button>
      <button class="btn btn-ghost" id="btnClearIndex" onclick="clearIndex()" style="font-size: 12px;">
        Rebuild Page Index
      </button>
    </div>

  </div>

  <!-- Right panel: log -->
  <div class="right-panel">
    <div class="log-header">
      <h2>Activity Log</h2>
      <button class="btn btn-ghost" onclick="clearLog()" style="padding: 6px 12px; font-size: 11px;">Clear log</button>
    </div>
    <div class="log-area" id="logArea">
      <div class="log-empty">Waiting to start…</div>
    </div>
    <div class="failed-section" id="failedSection">
      <h3>Failed Pages</h3>
      <div id="failedList"></div>
    </div>
  </div>
</div>

<script>
  // testMode removed — use batchSize slider instead
  let logEmpty = true;
  let isPaused = false;

  // ── SSE ──────────────────────────────────────────────────────────────────────
  const es = new EventSource('/events');
  es.onmessage = e => {
    const { type, payload } = JSON.parse(e.data);
    if (type === 'log') appendLog(payload.msg, payload.level);
    if (type === 'state') updateState(payload);
  };

  // ── Load initial status ───────────────────────────────────────────────────────
  fetch('/api/status').then(r => r.json()).then(data => {
    document.getElementById('statTotal').textContent = data.total ?? '—';
    document.getElementById('statCompleted').textContent = data.completed ?? 0;
    document.getElementById('statFailed').textContent = data.failed ?? 0;
    document.getElementById('statRemaining').textContent = data.remaining ?? '—';
    updateProgressBar(data.completed, data.total);
  });

  // ── State update ─────────────────────────────────────────────────────────────
  function updateState(s) {
    document.getElementById('statTotal').textContent = s.total || '—';
    document.getElementById('statCompleted').textContent = s.completed ?? 0;
    document.getElementById('statFailed').textContent = s.failed ?? 0;
    document.getElementById('statRemaining').textContent = s.remaining ?? '—';
    updateProgressBar(s.completed, s.total);
    updateStatusBadge(s.status);
    updateButtons(s.status);
    updateCurrentCard(s.current);

    if (s.failed > 0) loadFailed();
  }

  function updateProgressBar(done, total) {
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
  }

  function updateStatusBadge(status) {
    const map = {
      idle: ['status-idle', 'Idle'],
      running: ['status-running', 'Running'],
      paused: ['status-paused', 'Paused'],
      done: ['status-done', 'Done'],
      error: ['status-error', 'Error'],
    };
    const [cls, label] = map[status] || map.idle;
    document.getElementById('statusBadge').innerHTML =
      `<span class="status-badge ${cls}">${label}</span>`;
  }

  function updateButtons(status) {
    const start = document.getElementById('btnStart');
    const pause = document.getElementById('btnPause');
    const stop = document.getElementById('btnStop');
    const clear = document.getElementById('btnClear');
    const settings = document.getElementById('batchSettings');

    const running = status === 'running';
    const paused = status === 'paused';
    const active = running || paused;

    start.disabled = active;
    start.textContent = active ? (running ? '▶ Running…' : '▶ Paused') : '▶ Start';
    pause.disabled = !running;
    pause.textContent = '⏸ Pause';
    stop.disabled = !active;
    clear.disabled = active;

    // Resume button
    if (paused) {
      pause.textContent = '▶ Resume';
      pause.disabled = false;
      pause.className = 'btn btn-success';
      pause.onclick = resumeJob;
    } else {
      pause.className = 'btn btn-warn';
      pause.onclick = pauseJob;
    }
  }

  function updateCurrentCard(current) {
    const card = document.getElementById('currentCard');
    if (!current) {
      card.innerHTML = '<div class="idle-msg">Not running</div>';
      return;
    }
    card.innerHTML = `
      <div class="current-label">Page ${current.index} of ${current.total}</div>
      <div class="current-title">${current.title}</div>
      <div class="current-url">${current.url}</div>
    `;
  }

  // ── Log ───────────────────────────────────────────────────────────────────────
  function appendLog(msg, level = 'info') {
    const area = document.getElementById('logArea');
    if (logEmpty) { area.innerHTML = ''; logEmpty = false; }
    const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
    const div = document.createElement('div');
    div.className = `log-line ${level}`;
    div.innerHTML = `<span class="ts">${ts}</span><span class="msg">${escHtml(msg)}</span>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function clearLog() {
    document.getElementById('logArea').innerHTML = '<div class="log-empty">Log cleared.</div>';
    logEmpty = false;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Failed ────────────────────────────────────────────────────────────────────
  function loadFailed() {
    fetch('/api/failed').then(r => r.json()).then(items => {
      if (!items.length) return;
      const sec = document.getElementById('failedSection');
      const list = document.getElementById('failedList');
      sec.classList.add('visible');
      list.innerHTML = items.map(f => `
        <div class="failed-item">
          <div class="failed-url">${escHtml(f.url)}</div>
          <div>${escHtml(f.clientName)} — ${escHtml(f.title)}</div>
          <div class="failed-reason">${escHtml(f.error)}</div>
        </div>
      `).join('');
    });
  }

  // ── Controls ──────────────────────────────────────────────────────────────────
  function startJob() {
    const token = document.getElementById('apiToken').value.trim();
    if (!token) { alert('Please enter your Instapage API token.'); return; }
    const batchSize = parseInt(document.getElementById('batchSize').value, 10);
    const delaySeconds = parseInt(document.getElementById('delaySeconds').value, 10);
    fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, batchSize, delaySeconds }),
    }).catch(err => appendLog('Failed to start: ' + err.message, 'error'));
  }

  function pauseJob() {
    fetch('/api/pause', { method: 'POST' });
  }

  function resumeJob() {
    fetch('/api/resume', { method: 'POST' });
  }

  function stopJob() {
    if (!confirm('Stop the current job?')) return;
    fetch('/api/stop', { method: 'POST' });
  }

  function clearIndex() {
    if (!confirm('Delete the cached page index? It will be rebuilt on the next run (takes ~2 min).')) return;
    fetch('/api/clear-index', { method: 'POST' }).then(() => appendLog('Index cleared — will rebuild next run.', 'warn'));
  }

  function clearProgress() {
    if (!confirm('Reset all progress? This cannot be undone.')) return;
    fetch('/api/clear-progress', { method: 'POST' })
      .then(r => r.json())
      .then(() => {
        appendLog('Progress reset.', 'warn');
        document.getElementById('statCompleted').textContent = '0';
        document.getElementById('statFailed').textContent = '0';
        document.getElementById('failedSection').classList.remove('visible');
        fetch('/api/status').then(r => r.json()).then(data => {
          document.getElementById('statTotal').textContent = data.total ?? '—';
          document.getElementById('statRemaining').textContent = data.remaining ?? '—';
          updateProgressBar(0, data.total);
        });
      });
  }
</script>
</body>
</html>
